<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Family Gatherings — Sign in</title><style>body{font-family:system-ui;background:#f8f6f0;color:#26352c;margin:0}main{max-width:430px;margin:9vh auto;padding:28px;background:white;border:1px solid #dce5dc;border-radius:18px;box-shadow:0 4px 20px #0001}h1{color:#315b45}label{display:block;margin-top:14px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #b8c9bd}button{background:#315b45;color:white;cursor:pointer;margin-top:18px}button.secondary{background:white;color:#315b45}#message{white-space:pre-wrap;line-height:1.5}.small{font-size:.85rem;color:#657267}</style></head><body><main><h1>Our Family Gatherings</h1><p>Private family access · Acceso familiar privado</p><div id="form"><label>Email<input id="email" type="email" autocomplete="email" required value=""></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button id="signin">Sign in / Iniciar sesión</button><button id="signup" class="secondary">Request family access / Solicitar acceso</button><button id="reset" class="secondary">Reset password / Restablecer contraseña</button></div><p id="message" role="status"></p><p class="small">Only approved family members can access shared information. Your account must be confirmed and approved.</p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://sncuplksqadovxuxyjhc.supabase.co','sb_publishable_bRzkmoLnyt3sUl0Kk_6cKg_LETSyD7s');
const el=id=>document.getElementById(id),say=s=>el('message').textContent=s;
async function check(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;const {data,error}=await supabase.from('family_members').select('role,approved,display_name').eq('user_id',user.id).maybeSingle();if(error){say(error.message);return}if(data?.approved){say('Welcome, '+(data.display_name||user.email)+'! Your account is approved. The shared family app is being connected and will be available here after testing.');el('form').innerHTML='<button id="signout">Sign out / Cerrar sesión</button>';el('signout').onclick=async()=>{await supabase.auth.signOut();location.reload()}}else say('Your account is registered but awaiting family administrator approval. / Su cuenta está pendiente de aprobación.')}
el('signin').onclick=async()=>{say('Signing in…');const {error}=await supabase.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)say(error.message);else await check()};
el('signup').onclick=async()=>{say('Creating account…');const {error}=await supabase.auth.signUp({email:el('email').value.trim(),password:el('password').value,options:{emailRedirectTo:'https://fabianrousset.com/family/'}});say(error?error.message:'Check your email to confirm your account, then sign in. / Revise su correo para confirmar su cuenta.')};
el('reset').onclick=async()=>{const email=el('email').value.trim();if(!email){say('Enter your email address first.');return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://fabianrousset.com/family/'});say(error?error.message:'If the account exists, a reset email will be sent.')};
await check();
</script></body></html>
