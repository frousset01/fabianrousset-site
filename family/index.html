:root{background:#f5f2e9;color:#304035}
body{background:radial-gradient(ellipse at 8% 18%,rgba(215,228,206,.44),transparent 43%),radial-gradient(ellipse at 94% 72%,rgba(240,221,196,.36),transparent 45%),linear-gradient(180deg,#f8f6ef 0%,#f3f0e6 100%);min-height:100vh}
.wrap{position:relative}
section.panel{background:#fffdf8;border:1px solid #e4e1d6;box-shadow:0 4px 18px rgba(63,74,49,.055)}
nav{padding:14px 0;gap:8px}
nav button{background:#fffcf6;border-color:#dedfd2;color:#415b47}
nav button.active,button.primary{background:#466c51;border-color:#466c51;color:white}
button{border-color:#d8dfd1}
button:hover{filter:brightness(.97)}
.summary{background:#edf3e9;border:1px solid #dce7d7}
.tablebox{background:#fffefa;border-color:#b9cbb7}
.roundtable{background:#e2ebda}
.guestchip{background:#f6efe4}
footer{color:#69746a}
.seatcircle.selected{background:#d5e7d2;border:3px solid #285e3c;box-shadow:0 0 0 3px #bad9b5}.guestchip.selected{outline:3px solid #a5c7a1}.seatcircle{touch-action:manipulation;cursor:pointer} body.locked>.wrap,body.locked>header,body.locked>footer{display:none!important}#loginGate{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#e6eadc,#f8f2e6);padding:16px;z-index:999}.loginCard{background:#fffefa;border:1px solid #d6dfd1;border-radius:18px;padding:28px;width:min(100%,400px);box-shadow:0 10px 45px #253a2a20}.loginCard button{width:100%;margin-top:12px}.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:15px}.galleryCard{background:#f8f6ef;border:1px solid #e3e2d8;border-radius:12px;padding:8px;min-width:0}.galleryCard img{width:100%;height:145px;object-fit:cover;border-radius:8px}.galleryCard p{font-size:.78rem;overflow-wrap:anywhere}.galleryCard button{font-size:.8rem}
.galleryCard img{cursor:zoom-in;transition:transform .16s ease}.galleryCard img:hover{transform:scale(1.025)}
body.lightboxOpen{overflow:hidden}.photoLightbox{position:fixed;inset:0;z-index:2000;background:rgba(14,22,18,.94);display:none;align-items:center;justify-content:center;padding:55px 70px 38px;box-sizing:border-box;color:white}
.photoLightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:100%;max-height:100%;min-width:0}
.photoLightbox figure img{display:block;max-width:100%;max-height:calc(100dvh - 125px);width:auto;height:auto;object-fit:contain;border-radius:5px;box-shadow:0 8px 36px #0007}
.photoLightbox figcaption{text-align:center;font-size:.9rem;margin-top:12px;color:#f0f0e8;overflow-wrap:anywhere}
.photoLightbox button{position:absolute;background:#ffffff20;border:1px solid #ffffff55;color:#fff;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.photoLightbox button:hover,.photoLightbox button:focus-visible{background:#ffffff45}

.potluckRow{background:#fffefa;border:1px solid #e0e5d9;border-radius:13px;padding:14px;margin:10px 0}.potluckTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}.potluckStatus{font-size:.78rem;background:#f8e8d3;color:#77511d;padding:5px 10px;border-radius:999px}.potluckStatus.claimed{background:#e1eddd;color:#325b38}.potluckRow label{display:block;margin-top:9px}.potluckRow select,.potluckRow input{width:100%} </style></head><body>
<header><div class="row"><div style="flex:5"><h1 data-i="title">Our Family Gatherings</h1><p data-i="subtitle">Plan, cook, and celebrate together</p></div><div><button id="lang">Español</button></div></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div><footer>Private family application · Shared planning data synchronized through Supabase · Photos pending migration.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={lang:'en',guests:[{id:1,name:'Grandma',group:'Hosts',age:'adult',factor:1,diet:''},{id:2,name:'Grandpa',group:'Hosts',age:'adult',factor:1,diet:''},{id:3,name:'Maria',group:'Family A',age:'adult',factor:1,diet:''},{id:4,name:'David',group:'Family A',age:'adult',factor:1,diet:''},{id:5,name:'Sofia',group:'Family A',age:'child',factor:.65,diet:''},{id:6,name:'Lucas',group:'Family A',age:'young',factor:.4,diet:''}],recipes:[{id:11,name:'Chicken enchiladas',category:'main',servings:6,ingredients:'2 lb chicken\n12 tortillas\n3 cups enchilada sauce\n1 lb cheese',instructions:'Prepare filling, roll tortillas, cover with sauce and bake.',url:'',favorite:true},{id:12,name:'Mexican rice',category:'side',servings:6,ingredients:'2 cups dry rice\n3 cups broth',instructions:'Cook rice with broth.',url:'',favorite:true},{id:13,name:'Refried beans',category:'side',servings:6,ingredients:'3 cups cooked beans',instructions:'Mash and heat beans.',url:'',favorite:false}],events:[{id:21,name:'Sunday Family Dinner',date:'2026-11-15',invited:[1,2,3,4,5,6],menu:{main:11,sides:[12,13,null],dessert:null,pcts:[60,25,15,0],grams:400,buffer:10},tables:[{name:'Adults',seats:[1,2,3,4]},{name:'Kids',seats:[5,6]}]}],current:21};
let d=structuredClone(initial),tab='events',editingRecipe=null;
let remoteReady=false,remoteSaving=false,remotePending=false,remoteRevision=0,remoteTimer=null,suppressSave=false,lastSavedJson=null;
const tr={en:{title:'Our Family Gatherings',subtitle:'Plan, cook, and celebrate together',events:'Parties',guests:'Guests',seating:'Seating',recipes:'Recipes',shopping:'Shopping list',potluck:'Potluck',gallery:'Photos',settings:'Backup',save:'Save',add:'Add',name:'Name',date:'Date',main:'Main dish',side:'Side dish',dessert:'Dessert',optional:'Optional',attending:'Attending',factor:'Serving factor',family:'Family / group',age:'Age group',diet:'Dietary notes',adult:'Adult',teen:'Teen',child:'Child 6–12',young:'Child 3–5',toddler:'Toddler',favorite:'Favorite',servings:'Recipe servings',ingredients:'Ingredients (one per line)',instructions:'Instructions',source:'Source URL',plates:'Adult-equivalent plates',total:'Guests',menu:'Menu',percent:'Plate %',food:'Food quantity',table:'Table',newtable:'Add table',export:'Export backup',import:'Import backup',print:'Print',newparty:'New party',newguest:'Add guest',newrecipe:'Add recipe',all:'All',favorites:'Favorites',copy:'Import from website (paste recipe details)',notice:'Website URL import needs a server connection; for now paste ingredients and instructions and save the source link.'},es:{title:'Nuestras Reuniones Familiares',subtitle:'Planear, cocinar y celebrar juntos',events:'Fiestas',guests:'Invitados',seating:'Mesas',recipes:'Recetas',shopping:'Lista de compras',potluck:'Cooperación',gallery:'Fotos',settings:'Respaldo',save:'Guardar',add:'Agregar',name:'Nombre',date:'Fecha',main:'Plato principal',side:'Acompañamiento',dessert:'Postre',optional:'Opcional',attending:'Asistirán',factor:'Porción relativa',family:'Familia / grupo',age:'Edad',diet:'Restricciones alimentarias',adult:'Adulto',teen:'Adolescente',child:'Niño 6–12',young:'Niño 3–5',toddler:'Menor de 3',favorite:'Favorita',servings:'Porciones de receta',ingredients:'Ingredientes (uno por línea)',instructions:'Preparación',source:'Enlace de origen',plates:'Porciones equivalentes de adulto',total:'Invitados',menu:'Menú',percent:'% del plato',food:'Cantidad de comida',table:'Mesa',newtable:'Agregar mesa',export:'Exportar respaldo',import:'Importar respaldo',print:'Imprimir',newparty:'Nueva fiesta',newguest:'Agregar invitado',newrecipe:'Agregar receta',all:'Todas',favorites:'Favoritas',copy:'Importar de internet (pegar detalles)',notice:'La importación automática desde un enlace requiere un servidor; por ahora pega los ingredientes y pasos y guarda el enlace.'}};
const t=k=>tr[d.lang][k]||k,save=()=>{if(remoteReady&&!suppressSave&&JSON.stringify(d)!==lastSavedJson)queueRemoteSave()},currentParty=()=>d.events.find(e=>e.id===d.current)||d.events[0],recipe=id=>d.recipes.find(r=>r.id===Number(id)),guest=id=>d.guests.find(g=>g.id===Number(id)),uid=()=>Date.now()+Math.floor(Math.random()*10000);
function setTab(v){tab=v;render()}function render(){if(!suppressSave)save();document.documentElement.lang=d.lang;document.querySelector('[data-i=title]').textContent=t('title');document.querySelector('[data-i=subtitle]').textContent=t('subtitle');$('#lang').textContent=d.lang==='en'?'Español':'English';$('#nav').innerHTML=['events','guests','seating','recipes','shopping','potluck','gallery','settings'].map(k=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${t(k)}</button>`).join('');$('#main').innerHTML=({events:renderEvents,guests:renderGuests,seating:renderSeating,recipes:renderRecipes,shopping:renderShopping,potluck:renderPotluck,gallery:renderGallery,settings:renderSettings}[tab])();if(tab==='gallery')setTimeout(loadCloudGallery,0)}
function evSelect(){return `<select onchange="d.current=Number(this.value);render()">${d.events.map(e=>`<option value="${e.id}" ${e.id===d.current?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`}
function renderEvents(){const e=currentParty(),m=e.menu;return `<section class="panel"><div class="row"><div>${evSelect()}</div><button onclick="newEvent()">${t('newparty')}</button></div><div class="grid"><div><label>${t('name')}</label><input value="${esc(e.name)}" onchange="currentParty().name=this.value;render()"></div><div><label>${t('date')}</label><input type="date" value="${e.date}" onchange="currentParty().date=this.value;save()"></div></div></section><section class="panel"><div class="row"><h2>${t('attending')}</h2><button type="button" onclick="selectAllGuests(true)">${d.lang==='es'?'Seleccionar todos':'Select all'}</button><button type="button" onclick="selectAllGuests(false)">${d.lang==='es'?'Deseleccionar todos':'Clear all'}</button></div><div class="grid">${d.guests.map(g=>`<label class="guest"><input type="checkbox" ${e.invited.includes(g.id)?'checked':''} onchange="toggleGuest(${g.id},this.checked)"><span>${esc(g.name)} <small class="small">${esc(g.group)}</small></span></label>`).join('')}</div><p class="small">${e.invited.length} ${t('total')} · ${eq().toFixed(2)} ${t('plates')}</p></section><section class="panel"><h2>${t('menu')}</h2>${dishSelect('main',0,m.main)}${[0,1,2].map(i=>dishSelect('side',i,m.sides[i])).join('')}${dishSelect('dessert',0,m.dessert)}<h3>${t('percent')}</h3><p class="small">Main + selected sides should equal 100%. Dessert is separate.</p>${['main',...m.sides].map((id,i)=>i===0||id?`<div class="menurow"><span>${esc(i===0?(recipe(m.main)?.name||t('main')):(recipe(id)?.name||t('side')))}</span><input class="pct" type="number" min="0" max="100" value="${m.pcts[i]}" onchange="setPct(${i},this.value)"></div>`:'').join('')}<div class="summary">${m.pcts.reduce((s,n,i)=>s+((i===0||m.sides[i-1])?Number(n):0),0)}% allocated ${m.pcts.reduce((s,n,i)=>s+((i===0||m.sides[i-1])?Number(n):0),0)===100?'✓':'⚠'}</div><div class="grid"><div><label>Grams per adult plate (cooked food)</label><input type="number" min="100" value="${m.grams}" onchange="currentParty().menu.grams=Number(this.value);render()"></div><div><label>Extra food / leftovers (%)</label><input type="number" min="0" max="100" value="${m.buffer}" onchange="currentParty().menu.buffer=Number(this.value);render()"></div></div>${foodSummary()}</section>`}
function dishSelect(type,i,val){let options=d.recipes.filter(r=>r.category===type);return `<label>${type==='side'?t('side')+' '+(i+1):t(type)} ${type==='main'?'*':'('+t('optional')+')'}</label><select onchange="setDish('${type}',${i},this.value)"><option value="">—</option>${options.map(r=>`<option value="${r.id}" ${r.id===val?'selected':''}>${esc(r.name)} ${r.favorite?'★':''}</option>`).join('')}</select>`}
function setDish(type,i,v){const m=currentParty().menu;if(type==='main')m.main=Number(v)||null;else if(type==='dessert')m.dessert=Number(v)||null;else {m.sides[i]=Number(v)||null;if(!v)m.pcts[i+1]=0}render()}
function setPct(i,v){currentParty().menu.pcts[i]=Math.max(0,Math.min(100,Number(v)||0));render()}
function selectAllGuests(on){currentParty().invited=on?d.guests.map(g=>g.id):[];if(!on)currentParty().tables.forEach(t=>t.seats=t.seats.map(()=>null));render()}
function toggleGuest(id,on){const e=currentParty();e.invited=on?[...new Set([...e.invited,id])]:e.invited.filter(x=>x!==id);render()}
function eq(){return currentParty().invited.reduce((n,id)=>n+(Number(guest(id)?.factor)||0),0)}
function foodSummary(){let m=currentParty().menu,base=eq()*m.grams*(1+m.buffer/100);let rows=[{id:m.main,pct:m.pcts[0]},...m.sides.map((id,i)=>({id,pct:m.pcts[i+1]}))].filter(x=>x.id);return `<h3>${t('food')}</h3><table><tr><th>Dish</th><th>Cooked kg</th><th>Recipe batches*</th></tr>${rows.map(x=>`<tr><td>${esc(recipe(x.id)?.name)}</td><td>${(base*x.pct/100/1000).toFixed(2)}</td><td>${(eq()*x.pct/100*(1+m.buffer/100)/(recipe(x.id)?.servings||1)).toFixed(2)}</td></tr>`).join('')}</table><p class="small">*Recipe batches are rough estimates based on portion shares; recipe yields and weights must be checked. Dessert: ${m.dessert?esc(recipe(m.dessert)?.name):'—'}.</p>`}
function newEvent(){let id=uid();d.events.push({id,name:'New gathering',date:new Date().toISOString().slice(0,10),invited:[],menu:{main:null,sides:[null,null,null],dessert:null,pcts:[100,0,0,0],grams:400,buffer:10},tables:[{name:'Adults',seats:[]},{name:'Kids',seats:[]}]});d.current=id;render()}
function renderGuests(){return `<section class="panel"><h2>${t('newguest')}</h2><form onsubmit="addGuest(event)"><div class="grid"><div><label>${t('name')}</label><input name="name" required></div><div><label>${t('family')}</label><input name="group" placeholder="Family / Friends"></div><div><label>${t('age')}</label><select name="age" onchange="this.form.factor.value=({adult:1,teen:1,child:.65,young:.4,toddler:.25})[this.value]">${['adult','teen','child','young','toddler'].map(x=>`<option value="${x}">${t(x)}</option>`).join('')}</select></div><div><label>${t('factor')} (0–2)</label><input name="factor" type="number" min="0" max="2" step=".05" value="1"></div><div><label>${t('diet')}</label><input name="diet"></div></div><p><button class="primary">${t('add')}</button></p></form></section><section class="panel"><h2>${t('guests')}</h2>${d.guests.map(g=>`<div class="guest"><span><b>${esc(g.name)}</b> · ${esc(g.group)} · ${t(g.age)} · ${g.factor}×<br><small class="small">${esc(g.diet)}</small></span><button onclick="editGuest(${g.id})">Edit</button><button class="danger" onclick="deleteGuest(${g.id})">×</button></div>`).join('')}</section>`}
function addGuest(ev){ev.preventDefault();const f=ev.target;d.guests.push({id:uid(),name:f.elements.namedItem('name').value,group:f.elements.namedItem('group').value||'Friends',age:f.elements.namedItem('age').value,factor:Number(f.elements.namedItem('factor').value),diet:f.elements.namedItem('diet').value});render()}
function editGuest(id){let g=guest(id),name=prompt(t('name'),g.name);if(name===null)return;g.name=name;let group=prompt(t('family'),g.group);if(group!==null)g.group=group;let factor=prompt(t('factor'),g.factor);if(factor!==null&&Number.isFinite(Number(factor)))g.factor=Math.max(0,Math.min(2,Number(factor)));let diet=prompt(t('diet'),g.diet);if(diet!==null)g.diet=diet;render()}
function deleteGuest(id){if(!confirm('Delete guest?'))return;d.guests=d.guests.filter(g=>g.id!==id);d.events.forEach(e=>{e.invited=e.invited.filter(x=>x!==id);e.tables.forEach(t=>t.seats=t.seats.filter(x=>x!==id))});render()}

let selectedGuest=null;

let selectedSeat=null;
function chooseGuest(id){
 selectedGuest=(selectedGuest===id?null:id);
 selectedSeat=null;
 render();
}
function clearSelectedSeat(){
 if(!selectedSeat)return;
 const {ti,si}=selectedSeat;
 currentParty().tables[ti].seats[si]=null;
 selectedGuest=null;selectedSeat=null;render();
}
function renderSeating(){
 const e=currentParty(),seated=e.tables.flatMap(t=>t.seats).filter(id=>id&&e.invited.includes(id));
 const available=e.invited.filter(id=>!seated.includes(id));
 const selectedName=selectedGuest?guest(selectedGuest)?.name:null;
 const instructions=d.lang==='es'
 ?'Toca a una persona sentada para seleccionarla; luego toca otro asiento para moverla o intercambiar lugares. Usa «Quitar de la mesa» para dejarla sin asiento.'
 :'Tap a seated person to select them, then tap another seat to move or swap them. Use “Remove from table” to unseat them.';
 return `<section class="panel"><div class="row"><h2>${t('seating')}</h2><div>${evSelect()}</div></div>
 <p class="small">${instructions}</p>
 <div class="summary" role="status"><b>${d.lang==='es'?'Seleccionado':'Selected'}:</b> ${selectedName?esc(selectedName):(d.lang==='es'?'Nadie':'Nobody')}
 ${selectedGuest?`<div class="row" style="margin-top:9px"><button class="danger" onclick="unseatGuest(${selectedGuest})">${d.lang==='es'?'Quitar de la mesa':'Remove from table'}</button><button onclick="selectedGuest=null;selectedSeat=null;render()">${d.lang==='es'?'Cancelar':'Cancel'}</button></div>`:''}</div>
 <div class="tables">${e.tables.map((table,ti)=>`<div class="tablebox"><div class="row"><input aria-label="Table name" value="${esc(table.name)}" onchange="currentParty().tables[${ti}].name=this.value;save()"><button class="danger" onclick="removeTable(${ti})" aria-label="Delete table">×</button></div>
 <div class="roundtable"><span>${esc(table.name)}</span></div>
 <div class="seatgrid">${table.seats.map((id,si)=>`<button type="button" class="seatcircle ${id?'occupied':''} ${selectedGuest&&selectedGuest===id?'selected':''}" aria-pressed="${!!(selectedGuest&&selectedGuest===id)}" onclick="tapSeat(${ti},${si})" ${id?'draggable="true" ondragstart="dragSeat(event,'+id+')"':''} ondragover="event.preventDefault()" ondrop="dropSeat(event,${ti},${si})" title="${id?'Tap to select or move':'Tap to place selected guest'}">${id?esc(guest(id)?.name||'Unknown'):'+'}</button>`).join('')}</div>
 <div class="row"><button onclick="currentParty().tables[${ti}].seats.push(null);render()">+ ${d.lang==='es'?'Asiento':'Seat'}</button><button onclick="removeEmptySeats(${ti})">${d.lang==='es'?'Quitar asientos vacíos':'Remove empty seats'}</button></div></div>`).join('')}</div>
 <p><button class="primary" onclick="currentParty().tables.push({name:'Table '+(currentParty().tables.length+1),seats:[null,null,null,null,null,null]});render()">${t('newtable')}</button></p>
 <h3>${d.lang==='es'?'Sin asiento':'Unseated'} (${available.length})</h3><div class="guestpool">${available.map(id=>`<button type="button" class="guestchip ${selectedGuest===id?'selected':''}" draggable="true" ondragstart="dragSeat(event,${id})" onclick="chooseGuest(${id})">${esc(guest(id)?.name)}</button>`).join('')||'<span class="small">Everyone is seated.</span>'}</div>
 </section>`;
}
function unseatGuest(id){
 currentParty().tables.forEach(t=>t.seats=t.seats.map(x=>x===id?null:x));
 selectedGuest=null;selectedSeat=null;render();
}
function tapSeat(ti,si){
 const e=currentParty(), target=e.tables[ti], old=target.seats[si];
 if(selectedGuest){
  if(old===selectedGuest){selectedGuest=null;selectedSeat=null;render();return}
  // Move selected guest into empty seat, or swap with the current occupant.
  let source=null;
  for(let i=0;i<e.tables.length;i++){
   let j=e.tables[i].seats.indexOf(selectedGuest);
   if(j!==-1){source={ti:i,si:j};break}
  }
  if(source)e.tables[source.ti].seats[source.si]=old||null;
  target.seats[si]=selectedGuest;
  selectedGuest=null;selectedSeat=null;render();return;
 }
 if(old){selectedGuest=old;selectedSeat={ti,si};render();return}
 // Empty seat with nobody selected: direct name choice from available guests.
 const options=e.invited.filter(id=>!e.tables.some(t=>t.seats.includes(id)));
 if(!options.length)return;
 const answer=prompt(d.lang==='es'?'Escribe el nombre de un invitado sin asiento, o toca su nombre primero:':'Type an unseated guest name, or tap their name below first:','');
 if(answer===null||!answer.trim())return;
 const found=options.map(guest).find(g=>g?.name.toLowerCase()===answer.trim().toLowerCase());
 if(found){target.seats[si]=found.id;render()}
 else alert(d.lang==='es'?'Invitado no disponible.':'Guest not available.');
}
function dragSeat(ev,id){ev.dataTransfer.setData('text/plain',String(id))}
function dropSeat(ev,ti,si){
 ev.preventDefault();let id=Number(ev.dataTransfer.getData('text/plain'));
 if(!currentParty().invited.includes(id))return;
 selectedGuest=id;tapSeat(ti,si);
}
function removeEmptySeats(ti){currentParty().tables[ti].seats=currentParty().tables[ti].seats.filter(Boolean);render()}
function removeTable(ti){if(confirm('Remove table and unseat its guests?')){currentParty().tables.splice(ti,1);selectedGuest=null;selectedSeat=null;render()}}
function renderRecipes(){return `<section class="panel"><div class="row"><h2>${t('recipes')}</h2><button class="primary" onclick="editingRecipe='new';render()">${t('newrecipe')}</button></div><p class="small">${t('notice')}</p>${editingRecipe!==null?recipeForm():''}<div class="grid">${d.recipes.map(r=>`<div class="panel" style="border:1px solid #e1e6dd;border-radius:12px;padding:12px"><h3>${esc(r.name)}</h3><p class="small">${t(r.category)} · ${r.servings} servings</p><div class="row"><button onclick="rFavorite(${r.id})">${r.favorite?'★':'☆'} ${t('favorite')}</button><button onclick="editingRecipe=${r.id};render()">Edit</button><button class="danger" onclick="deleteRecipe(${r.id})">×</button></div></div>`).join('')}</div></section>`}
function recipeForm(){let r=editingRecipe==='new'?{name:'',category:'side',servings:6,ingredients:'',instructions:'',url:'',favorite:false}:recipe(editingRecipe);return `<form onsubmit="saveRecipe(event)" style="border:1px solid #d8e3d7;padding:14px;border-radius:12px;margin-bottom:15px"><h3>${t('newrecipe')}</h3><label>${t('name')}</label><input name="rname" required value="${esc(r.name)}"><label>Category</label><select name="category">${['main','side','dessert'].map(c=>`<option value="${c}" ${r.category===c?'selected':''}>${t(c)}</option>`).join('')}</select><label>${t('servings')}</label><input type="number" min="1" name="servings" value="${r.servings}"><label>Estimated cooked weight per recipe serving (grams)</label><input type="number" min="1" name="portionGrams" value="${r.portionGrams|| (r.category==='main'?250:r.category==='side'?120:100)}"><label>${t('ingredients')}</label><textarea rows="5" name="ingredients">${esc(r.ingredients)}</textarea><label>${t('instructions')}</label><textarea rows="4" name="instructions">${esc(r.instructions)}</textarea><label>${t('source')}</label><input type="url" name="url" placeholder="https://example.com/recipe" value="${esc(r.url)}"><p><button type="button" onclick="importRecipeFromUrl(this)">Import recipe from URL</button> <span class="small" data-import-status></span></p><label><input type="checkbox" name="favorite" style="width:auto" ${r.favorite?'checked':''}> ${t('favorite')}</label><p><button class="primary">${t('save')}</button> <button type="button" onclick="editingRecipe=null;render()">Cancel</button></p></form>`}
async function importRecipeFromUrl(btn){
 const f=btn.closest('form'),url=f.elements.namedItem('url').value.trim(),status=f.querySelector('[data-import-status]');
 if(!url){status.textContent='Paste a recipe URL first.';return}
 btn.disabled=true;status.textContent='Retrieving recipe…';
 try{
  const {data:{session}}=await familyClient.auth.getSession();
  if(!session)throw Error('Please sign in again.');
  const res=await fetch('https://sncuplksqadovxuxyjhc.supabase.co/functions/v1/import-recipe',{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_bRzkmoLnyt3sUl0Kk_6cKg_LETSyD7s'},body:JSON.stringify({url})
  });
  const data=await res.json();
  if(!res.ok)throw Error(data.error||'Unable to import this recipe.');
  f.elements.namedItem('rname').value=data.name||'';
  f.elements.namedItem('servings').value=data.servings||6;
  f.elements.namedItem('ingredients').value=data.ingredients||'';
  f.elements.namedItem('instructions').value=data.instructions||'';
  status.textContent='Recipe loaded! Review details and click Save.';
 }catch(e){status.textContent='Import unavailable: '+e.message+' You can still enter the recipe manually.'}
 finally{btn.disabled=false}

async function galleryAdd(files){
 const selectedFiles=Array.from(files||[]);
 const status=document.getElementById('galleryStatus');
 if(!selectedFiles.length){if(status)status.textContent='No photos selected.';return}
 if(status)status.textContent='Adding '+selectedFiles.length+' photo(s)…';
 let added=0,errors=[];
 try{
  const db=await galleryDB();
  for(const file of selectedFiles){
   try{
    if(!file.type.startsWith('image/'))throw new Error('Not an image');
    const dataUrl=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(reader.error||new Error('Unable to read photo'));
      reader.readAsDataURL(file);
    });
    const image=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error('Unable to decode photo'));
      img.src=dataUrl;
    });
    const scale=Math.min(1,1400/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Unable to prepare photo')),'image/jpeg',.8));
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('photos','readwrite');
      tx.objectStore('photos').put({id:uid(),name:file.name,created:Date.now(),blob});
      tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
    });
    added++;
   }catch(e){errors.push(file.name+': '+e.message)}
  }
  if(status)status.textContent=added+' photo(s) saved'+(errors.length?'; '+errors.join('; '):'.');
  await loadGallery();
 }catch(e){
  if(status)status.textContent='Photo storage failed: '+e.message;
 }
}

async function uploadCloudPhotos(files){
 const status=document.getElementById('galleryStatus');if(!currentUser){return}
 let ok=0,errors=[];
 for(const file of files){try{
  if(file.size>10*1024*1024)throw Error('Maximum photo size is 10 MB');
  const safe=(file.name||'photo').replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=currentUser.id+'/'+crypto.randomUUID()+'-'+safe;
  const {error}=await familyClient.storage.from('family-photos').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
  if(error)throw error;ok++;
 }catch(e){errors.push(file.name+': '+e.message)}}
 if(status)status.textContent=ok+' photo(s) uploaded.'+(errors.length?' Errors: '+errors.join('; '):'');
 await loadCloudGallery();
}
async function loadCloudGallery(){
 const grid=document.getElementById('galleryGrid');if(!grid)return;

 const {data:dirs,error}=await familyClient.storage.from('family-photos').list('',{limit:1000});
 if(error){grid.textContent='Unable to load photos: '+error.message;return}
 let paths=[];
 for(const dir of dirs||[]){if(dir.id){paths.push(dir.name)}else{
  const {data:files}=await familyClient.storage.from('family-photos').list(dir.name,{limit:1000});
  for(const f of files||[])if(f.id)paths.push(dir.name+'/'+f.name)
 }}
 const photos=[];
 for(const path of paths){const {data,error}=await familyClient.storage.from('family-photos').createSignedUrl(path,3600);
 if(!error&&data?.signedUrl)photos.push({id:path,name:path.split('/').pop().replace(/^[0-9a-f-]{36}-/,''),url:data.signedUrl})}
 galleryPhotos=photos;galleryIndex=0;
 grid.innerHTML=photos.length?'':'<p>No shared photos yet.</p>';
 for(let i=0;i<photos.length;i++){
  const p=photos[i],tile=document.createElement('div');tile.className='galleryCard';
  const img=document.createElement('img');img.src=p.url;img.alt=p.name;img.loading='lazy';img.onclick=()=>openGalleryPhoto(i);tile.appendChild(img);
  const cap=document.createElement('div');cap.textContent=p.name;tile.appendChild(cap);
  if(currentRole==='admin'||p.id.startsWith(currentUser.id+'/')){
   const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this photo for the whole family?'))return;const {error}=await familyClient.storage.from('family-photos').remove([p.id]);if(error)alert(error.message);else loadCloudGallery()};tile.appendChild(del)
  }

 }
}
